<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>この肉の物語 | 館山ジビエセンター</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f6f4ee; --card:#fff; --ink:#1d211c; --ink2:#57604f; --ink3:#8e9486;
    --line:#e4ded0; --moss:#3c6b4a; --moss-soft:#e8f0e9; --gold:#a8781f; --gold-soft:#f6ecd8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12150f; --card:#1a1e18; --ink:#e9ece5; --ink2:#a5ad9f; --ink3:#727a6d;
           --line:#282e26; --moss:#7ab493; --moss-soft:#1b2c21; --gold:#d3a95c; --gold-soft:#2e2718; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    line-height:1.8;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px}
  header{text-align:center;padding:14px 0 22px}
  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);margin:0 0 8px}
  h1{font-size:23px;margin:0;font-weight:700;letter-spacing:.02em}
  .sub{font-size:13px;color:var(--ink2);margin:8px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .prod{text-align:center;padding:22px 18px}
  .prod .nm{font-size:20px;font-weight:700}
  .prod .kg{font-size:14px;color:var(--ink2);margin-top:4px}
  .prod .cd{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink3);margin-top:8px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2 .ic{font-size:17px}
  .row{display:flex;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--ink3);flex:0 0 92px}
  .row .v{font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{font-size:12px;background:var(--moss-soft);color:var(--moss);border-radius:999px;padding:3px 10px}
  #stamps .chip.on{background:var(--moss)!important;color:#fff!important;border-color:var(--moss)!important}
  .safe{background:var(--moss-soft);border:1px solid var(--moss);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--moss)}
  label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
  textarea{min-height:96px;resize:vertical}
  .stars{display:flex;gap:6px}
  .stars button{flex:1;padding:11px 0;font-size:19px;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;cursor:pointer;color:var(--ink3)}
  .stars button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
  .send{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:var(--moss);
    color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .send:disabled{opacity:.5}
  .msg{margin-top:10px;font-size:13.5px;text-align:center}
  .voice{border-top:1px solid var(--line);padding:11px 0;font-size:14px}
  .voice:first-of-type{border-top:none}
  .voice .top{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink3)}
  .voice .nm{font-weight:700;color:var(--ink)}
  .voice .cm{margin-top:4px;white-space:pre-wrap}
  footer{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:26px;line-height:1.9}
  .center{text-align:center;color:var(--ink2);padding:30px 10px}
  /* 一覧から一頭へ飛ぶ行 */
  .lnk{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit}
  .lnk:last-of-type{border-bottom:none}
  .lnk-main{flex:1 1 auto;min-width:0}
  .lnk-t{font-size:16px;font-weight:700}
  .lnk-s{font-size:13px;color:var(--ink2);margin-top:2px}
  .lnk-go{flex:0 0 auto;color:var(--ink3);font-size:20px;line-height:1}
  .chip-a{text-decoration:none}
  .lot{border-top:1px solid var(--line);padding:12px 0}
  .lot:first-of-type{border-top:none}
  .lot-h{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .lot-q{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:400}
  .lot-n{font-size:12.5px;color:var(--ink3);margin:4px 0 2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">館山ジビエセンター</p>
    <h1>この肉の物語</h1>
    <p class="sub">お手元のお肉が、どこで生まれてどう届いたか</p>
  </header>
  <div id="main"><div class="center">読み込んでいます…</div></div>
  <footer>
    館山ジビエセンター（合同会社アルコ）<br>千葉県館山市西長田1163-5
  </footer>
</div>

<script>
const SB_URL='https://clpdyrehdgzgiidbfucj.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNscGR5cmVoZGd6Z2lpZGJmdWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyODEzNDksImV4cCI6MjA4ODg1NzM0OX0.cKxpyw0gyZj0Flsd8wzojiNFqyCEcrAF8tFpXXUmZck';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})});
  if(!r.ok) throw new Error(await r.text());
  const t=await r.text(); return t?JSON.parse(t):null;
}
function param(k){ return new URLSearchParams(location.search).get(k)||''; }

let story=null, rating=0;
// ?c=8桁     … パックのラベルから（お手元のお肉）
// ?i=個体番号 … 個体そのものから
// ?e=出店ID   … 出店の会場に貼る一覧
const code=param('c').replace(/[^0-9]/g,'');
const label=param('i').replace(/[^0-9A-Za-z\-぀-ヿ一-鿿]/g,'').slice(0,40);
const eventId=param('e').replace(/[^0-9a-fA-F-]/g,'').slice(0,36);
// ?i=個体番号&e=出店ID … 出店の個体シートのQR（会場までの距離と、その出店の「今日の商品」「ひとこと」も出す）
const mode = (eventId && !label) ? 'event' : (code ? 'pack' : (label ? 'individual' : 'none'));
const byIndividual = mode==='individual';

function fetchStory(){
  if(mode==='event')      return rpc('story_get_event',{p_event_id:eventId});
  if(mode==='individual') return rpc('story_get_individual',{p_label:label, p_event_id: eventId||null});
  return rpc('story_get',{p_code:code});
}

/* ── フードマイレージ ──
   「距離（km）」と「フードマイレージ（重量 × 距離 ＝ kg・km）」は別の指標として扱う。
   距離: 捕獲地点 → 館山ジビエセンター（→ 販売・提供地点。分かるときだけ）。
   フードマイレージ: 商品（パック）の実重量が分かるときだけ、商品重量 × 移動距離 で出す。生体重量は使わない。
   参考比較の値は app_settings.mileage_reference（管理画面で編集）。出典の無い値は出さない。 */
const REF_DEFAULT={ title:'どれくらい近い？ 参考比較',
  note:'一般的な輸送距離の参考値・概算です。産地の代表点から館山ジビエセンターまでの直線距離で、実際の船・トラックの経路はこれより長くなります。',
  items:[
    {name:'豪州産の牛肉',km:6600,kind:'estimate',source:'館山ジビエセンター試算（主産地: クイーンズランド州）',sourceUrl:null,calculationNote:'産地の代表点〜館山ジビエセンターの大円距離（直線）の概算'},
    {name:'米国産の豚肉',km:9800,kind:'estimate',source:'館山ジビエセンター試算（主産地: 中西部）',sourceUrl:null,calculationNote:'産地の代表点〜館山ジビエセンターの大円距離（直線）の概算'},
    {name:'チリ産の豚肉',km:17200,kind:'estimate',source:'館山ジビエセンター試算（産地の代表点: サンティアゴ周辺）',sourceUrl:null,calculationNote:'産地の代表点〜館山ジビエセンターの大円距離（直線）の概算'},
  ]};
let REF=REF_DEFAULT;
async function loadReference(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/app_settings?key=eq.mileage_reference&select=value`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(r.ok){ const j=await r.json(); if(j&&j[0]&&j[0].value&&Array.isArray(j[0].value.items)) REF=j[0].value; }
  }catch(e){ /* 取れなければ既定値のまま（表示は「参考値・概算」のまま） */ }
}
// 出典（source）の無い値は確定値として見せない
function refItems(){ return (REF.items||[]).filter(it=>it&&it.name&&Number(it.km)>0&&it.source); }
const STAMPS=['うまい！','くさみゼロ','やわらかい','子どもが完食','また食べたい','初めて食べた'];
let picked=new Set();
function fmtKm(v){ return v==null?'—':(Number(v)<100?Number(v).toFixed(1):Math.round(Number(v)).toLocaleString())+' km'; }
// フードマイレージ（kg・km）。重量か距離が無ければ null（0 にしない）
function foodMileageKgKm(kg, km){ const w=Number(kg), d=Number(km); if(!(w>0)||!(d>0)) return null; return Math.round(w*d*10)/10; }
// 表示用の形に揃える。将来: 販売店までの距離・輸送手段・CO2・市内消費率などはここに足す
function buildMileageModel(m, product){
  if(!m) return null;
  const cap=m.capture||{}, center=m.center||{}, venue=m.venue||null;
  const hasCap=cap.lat!=null&&cap.lng!=null, hasCenter=center.lat!=null&&center.lng!=null;
  const leg1=(hasCap&&hasCenter&&m.leg1_km!=null)?Number(m.leg1_km):null;
  const hasVenue=!!(venue&&venue.lat!=null&&venue.lng!=null&&m.leg2_km!=null);
  const leg2=hasVenue?Number(m.leg2_km):null;
  const legs=[{key:'capture-center',from:'捕獲地点',to:'館山ジビエセンター',km:leg1}];
  if(venue) legs.push({key:'center-venue',from:'館山ジビエセンター',to:venue.name||'販売・提供地点',km:leg2});
  const totalKm=leg1==null?null:(hasVenue?Math.round((leg1+leg2)*10)/10:leg1);
  const productKg=(product&&product.kg!=null&&Number(product.kg)>0)?Number(product.kg):null; // 商品の実重量だけ。生体重量は使わない
  return { legs, leg1, leg2, hasCap, hasCenter, hasVenue, venueName:venue?(venue.name||''):null, totalKm,
    complete:hasVenue, captureSrc:cap.src||null, productKg, kgKm:foodMileageKgKm(productKg,totalKm), transport:null, co2:null };
}
function cityOf(place){ const m=String(place||'').match(/^(.+?)(市|町|村)/); return m?m[1]:''; }
function mileageHtml(m){
  const model=buildMileageModel(m, story&&story.product);
  if(!model) return '';
  const ind=(story&&story.individual)||{};
  const city=cityOf(ind.place)||'館山';
  const items=refItems();
  let dist='';
  if(!model.hasCap||!model.hasCenter){
    dist=`<div style="font-size:13px;color:var(--ink2);">${!model.hasCap?'獲れた地区の位置がまだ登録されていないため、距離を出せません。':'センターの位置がまだ登録されていません。'}<br>このお肉が館山・南房総の山から来ていることは変わりません。</div>`;
  }else{
    dist=`<div style="font-size:13px;color:var(--ink2);margin:-6px 0 4px;">このお肉が旅した距離</div>
      ${model.legs.map(l=>`<div class="row"><span class="k" style="flex:0 0 auto;">${esc(l.from)} → ${esc(l.to)}</span><span class="v" style="margin-left:auto;">${l.km!=null?fmtKm(l.km):'（位置が未登録）'}</span></div>`).join('')}
      ${model.complete
        ? `<div class="row" style="border-bottom:none;"><span class="k">合計</span><span class="v" style="font-size:20px;color:var(--moss);margin-left:auto;">${fmtKm(model.totalKm)}</span></div>`
        : `<div class="row" style="border-bottom:none;"><span class="k" style="flex:0 0 auto;">捕獲地点 → 館山ジビエセンター まで</span><span class="v" style="font-size:20px;color:var(--moss);margin-left:auto;">${fmtKm(model.totalKm)}</span></div>
           <div style="font-size:12px;color:var(--ink3);">販売・提供地点までの距離は、まだ含まれていません。</div>`}
      ${model.captureSrc==='area'?'<div style="font-size:12px;color:var(--ink3);">獲れた場所は捕獲地区のおおよその中心で数えています。</div>':''}`;
  }
  const info=`<details id="mileInfo" style="margin-top:10px;"><summary style="cursor:pointer;font-size:13px;color:var(--gold);">ⓘ フードマイレージって？</summary>
    <div style="font-size:13.5px;color:var(--ink2);line-height:1.8;margin-top:8px;padding:12px;background:var(--bg);border-radius:10px;">
      食べ物が「どれくらいの量を、どれくらいの距離運ばれてきたか」を見るための指標です。<br>
      <b>フードマイレージ ＝ 食品の重量 × 輸送距離</b><br>
      一般に、生産地から食卓までの距離が短いほど、輸送に伴う環境負荷を小さくできる可能性があります。<br>
      館山ジビエは、館山周辺で捕獲された野生動物を館山ジビエセンターで食肉にしています。<br>
      <span style="font-size:12px;color:var(--ink3);">※フードマイレージは輸送に関する指標であり、生産・加工・冷蔵冷凍などを含む食品全体の環境負荷を表すものではありません。</span>
    </div></details>`;
  const strict=model.kgKm!=null?`<div class="row" id="mileKgKm" style="margin-top:8px;border-top:1px dashed var(--line);border-bottom:none;padding-top:10px;"><span class="k" style="flex:0 0 auto;">この商品のフードマイレージ</span><span class="v" style="margin-left:auto;">${model.kgKm.toLocaleString()} kg・km</span></div>
      <div style="font-size:12px;color:var(--ink3);">商品重量 ${model.productKg.toFixed(2)} kg × 移動距離 ${fmtKm(model.totalKm)}${model.complete?'':'（捕獲地点→センターまで）'}</div>`:'';
  let cmp='', btn='';
  if(model.totalKm!=null&&items.length){
    const maxKm=Math.max(...items.map(f=>Number(f.km)));
    const bar=(name,km,mine,note)=>`<div style="margin-top:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;${mine?'font-weight:700;color:var(--moss);':'color:var(--ink2);'}"><span>${esc(name)}</span><span>${mine?fmtKm(km):'約 '+Math.round(km).toLocaleString()+' km'}${note?` <span style="font-size:11px;color:var(--ink3);">${esc(note)}</span>`:''}</span></div>
        <div style="height:9px;background:var(--line);border-radius:5px;overflow:hidden;"><div style="height:100%;width:${Math.max(1.5,Math.min(100,km/maxKm*100))}%;background:${mine?'var(--moss)':'var(--ink3)'};border-radius:5px;"></div></div>
      </div>`;
    const first=items[0]; const ratio=model.totalKm>0?Math.round(Number(first.km)/model.totalKm):null;
    cmp=`<div id="mileBody" style="display:none;margin-top:10px;">
      <div style="font-size:14px;font-weight:700;">${esc(REF.title||'どれくらい近い？ 参考比較')}</div>
      <div style="font-size:12px;color:var(--ink3);">${esc(REF.note||'一般的な輸送距離の参考値・概算です。')}</div>
      ${bar('このお肉'+(model.complete?'':'（センターまで）'),model.totalKm,true,'')}${items.map(f=>bar(f.name,Number(f.km),false,f.kind==='estimate'?'参考値・概算':'')).join('')}
      ${ratio?`<div style="font-size:12.5px;color:var(--ink2);margin-top:10px;">${esc(first.name)}（参考値）と比べて、移動距離は <b>約${ratio.toLocaleString()}分の1</b>。</div>`:''}
      <details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;color:var(--ink3);">出典と注記</summary>
        <ul style="font-size:12px;color:var(--ink3);padding-left:18px;margin:6px 0 0;">${items.map(f=>`<li>${esc(f.name)}：${esc(f.source)}${f.calculationNote?'／'+esc(f.calculationNote):''}${f.sourceUrl?` <a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">出典</a>`:''}</li>`).join('')}</ul></details>
    </div>`;
    btn=`<button type="button" class="send" id="mileBtn" style="margin-top:12px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);" onclick="toggleMileage()">どれくらい近い？ 参考比較を見る</button>`;
  }
  const msg=`<div id="mileMsg" style="margin-top:16px;text-align:center;">
      <div style="font-size:20px;font-weight:700;color:var(--moss);line-height:1.5;">この一頭は、${esc(city)}の山から${model.leg1!=null?`<span style="white-space:nowrap;">${fmtKm(model.leg1)}</span>`:''}。</div>
      <div style="font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.8;">遠くから運ばれてきた食材ではなく、<br>この地域に生きていた命を、この地域で食材にしています。</div>
    </div>`;
  return `<div class="card"><h2><span class="ic">🚚</span>フードマイレージ</h2>${dist}${info}${strict}${btn}${cmp}${msg}</div>`;
}
function toggleMileage(){
  const b=document.getElementById('mileBody'), btn=document.getElementById('mileBtn');
  if(!b||!btn) return;
  const open=b.style.display==='none'; b.style.display=open?'block':'none';
  btn.textContent=open?'閉じる':'どれくらい近い？ 参考比較を見る';
}
function toggleStamp(s){ if(picked.has(s)) picked.delete(s); else picked.add(s); paintStamps(); }
function paintStamps(){
  document.querySelectorAll('#stamps button').forEach(b=>b.classList.toggle('on', picked.has(b.dataset.s)));
}

async function load(){
  const box=document.getElementById('main');
  const sub=document.querySelector('header .sub');
  if(mode==='none'){ box.innerHTML='<div class="center">お肉のラベルのQRコードから開いてください。</div>'; return; }
  if(mode==='individual') sub.textContent='この一頭が、どこで生まれてどう届いたか';
  if(mode==='event'){
    document.querySelector('header h1').textContent='本日のジビエ';
    sub.textContent='いま並んでいるお肉が、どこで獲れた一頭か';
  }
  try{
    [story]=await Promise.all([fetchStory(), loadReference()]);
  }catch(e){
    box.innerHTML='<div class="center">うまく読み込めませんでした。時間をおいてお試しください。</div>'; return;
  }
  if(!story){
    box.innerHTML= mode==='event'
      ? '<div class="center">この出店の一覧が見つかりませんでした。</div>'
      : mode==='individual'
      ? '<div class="center">この個体番号が見つかりませんでした。<br>番号をご確認ください。</div>'
      : '<div class="center">この番号のお肉が見つかりませんでした。<br>ラベルの数字をご確認ください。</div>';
    return;
  }
  if(mode==='event') renderEvent(); else render();
}

/* 出店の一覧。
   個体が分かるお肉と、小分けパックは分けて出す。
   小分けは「300個のうちのどれか」なので、どの一頭かは言えない。入っている頭たちだけ並べる。 */
function renderEvent(){
  const ev=story.event||{}, inds=story.individuals||[], lots=story.lots||[];
  let h='';
  h+=`<div class="card prod">
    <div class="nm">${esc(ev.venue||'')}</div>
    <div class="kg">${esc(ev.date||'')}${ev.end_date&&ev.end_date!==ev.date?` 〜 ${esc(ev.end_date)}`:''}</div>
    ${ev.title?`<div class="cd">${esc(ev.title)}</div>`:''}
  </div>`;

  if(inds.length){
    h+=`<div class="card"><h2><span class="ic">🌿</span>一頭ずつ分かるお肉（${inds.length}頭）</h2>
      <div style="font-size:13px;color:var(--ink2);margin:-6px 0 10px;">タップすると、その一頭の記録が開きます。</div>
      ${inds.map(i=>`<a class="lnk" href="?i=${encodeURIComponent(i.label)}">
        <div class="lnk-main">
          <div class="lnk-t">${esc(i.place||'—')}</div>
          <div class="lnk-s">${esc(i.species||'')}${i.sex?`（${esc(i.sex)}）`:''}${i.weight_total?` ${esc(i.weight_total)}kg`:''}
            ${i.capture_date?` ・ ${esc(i.capture_date)}獲れ`:''}</div>
          ${(i.parts&&i.parts.length)?`<div class="chips">${i.parts.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div>`:''}
        </div><span class="lnk-go">›</span></a>`).join('')}
    </div>`;
  }

  if(lots.length){
    h+=`<div class="card"><h2><span class="ic">🍖</span>小分けパック・加工商品（${lots.length}種）</h2>
      <div style="font-size:13px;color:var(--ink2);margin:-6px 0 10px;">
        まとめて作るので、<b>どの一つがどの一頭かは特定できません。</b><br>
        分かっているものは、入っている一頭たちをすべて載せています。
      </div>
      ${lots.map(l=>`<div class="lot">
        <div class="lot-h">${esc(l.name||'—')}<span class="lot-q">${esc(l.qty)}個</span></div>
        ${(l.members&&l.members.length)
          ? `<div class="lot-n">この商品に入っている ${l.members.length}頭</div>
             <div class="chips">${l.members.map(m=>`<a class="chip chip-a" href="?i=${encodeURIComponent(m.label)}">${esc(m.place||m.label)}</a>`).join('')}</div>`
          : `<div class="lot-n">${l.kind==='product'?'加工商品':'原料の記録は準備中です'}</div>`}
      </div>`).join('')}
    </div>`;
  }

  if(!inds.length && !lots.length){
    h+='<div class="center">この出店に持ってきたお肉は、まだ登録されていません。</div>';
  }

  h+=`<div class="card" style="text-align:center;font-size:13.5px;color:var(--ink2);">
    お買い上げのお肉は、ラベルのQRから<br>その一頭の記録と感想欄が開きます。
  </div>`;
  document.getElementById('main').innerHTML=h;
}

function render(){
  const p=story.product||{}, i=story.individual, parts=story.parts||[], voices=story.voices||[];
  const blend=story.blend||null;      // 複数頭を混ぜた小分けパックのとき、入っている頭たち
  let h='';

  if(p && p.name){
    h+=`<div class="card prod">
      <div class="nm">${esc(p.name)}</div>
      ${p.kg?`<div class="kg">${Number(p.kg).toFixed(3)} kg</div>`:''}
      ${p.ident?`<div class="cd">${esc(p.ident)}</div>`:''}
    </div>`;
  }else if(i){
    // 個体から開いたとき（出店シートのQRなど）。パックではなく一頭を見出しにする
    const sh=story.sheet||{}, ev=story.event||null;
    h+=`<div class="card prod">
      ${story.photo?`<img src="${esc(story.photo)}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:12px;display:block;">`:''}
      <div class="nm">${esc(i.place||'—')} の一頭</div>
      <div class="kg">${esc(i.species||'')}${i.sex?`（${esc(i.sex)}）`:''}${i.weight_total?` ${esc(i.weight_total)} kg`:''}</div>
      <div class="cd">${esc(i.label||'')}</div>
      ${sh.story_text?`<div style="margin-top:12px;font-size:14.5px;line-height:1.8;text-align:left;">${esc(sh.story_text)}</div>`:''}
      ${sh.product_note?`<div class="chips" style="justify-content:center;margin-top:10px;"><span class="chip">今日の商品：${esc(sh.product_note)}</span></div>`:''}
      ${ev?`<div class="cd" style="margin-top:8px;">${esc(ev.venue||'')}${ev.date?' '+esc(ev.date):''}</div>`:''}
    </div>`;
  }

  // まとめて作る商品は、どのパックがどの一頭かを言えない。入っている頭を全部載せる。
  if(blend && blend.length){
    h+=`<div class="card"><h2><span class="ic">🍖</span>この商品に入っている ${blend.length}頭</h2>
      <div style="font-size:13px;color:var(--ink2);margin:-6px 0 10px;">
        まとめて作っているため、<b>このパックがどの一頭かは特定できません。</b>
        使った一頭をすべて載せています。タップすると、その一頭の記録が開きます。
      </div>
      ${blend.map(b=>`<a class="lnk" href="?i=${encodeURIComponent(b.label)}">
        <div class="lnk-main">
          <div class="lnk-t">${esc(b.place||'—')}</div>
          <div class="lnk-s">${esc(b.species||'')}${b.sex?`（${esc(b.sex)}）`:''}${b.capture_date?` ・ ${esc(b.capture_date)}獲れ`:''}${b.method?` ・ ${esc(b.method)}`:''}</div>
        </div><span class="lnk-go">›</span></a>`).join('')}
      ${blend.every(b=>b.radiation_result)
        ? `<div class="safe" style="margin-top:10px;">放射性物質検査：<b>${blend.length}頭すべて ${esc(blend[0].radiation_result)}</b></div>` : ''}
    </div>`;
  }

  if(i){
    h+=`<div class="card">
      <h2><span class="ic">🌿</span>このお肉になった一頭</h2>
      <div class="row"><span class="k">獲れた場所</span><span class="v">${esc(i.place||'—')}</span></div>
      <div class="row"><span class="k">獲れた日</span><span class="v">${esc(i.capture_date||'—')}</span></div>
      ${i.method?`<div class="row"><span class="k">捕獲方法</span><span class="v">${esc(i.method)}</span></div>`:''}
      ${i.species?`<div class="row"><span class="k">鳥獣種</span><span class="v">${esc(i.species)}${i.sex?'（'+esc(i.sex)+'）':''}</span></div>`:''}
      ${i.weight_total?`<div class="row"><span class="k">体重</span><span class="v">${esc(i.weight_total)} kg</span></div>`:''}
      ${i.processed_date?`<div class="row"><span class="k">${i.processed_kind==='organ'?'さばいた日':'精肉した日'}</span><span class="v">${esc(i.processed_date)}${i.processed_kind==='organ'?`<span style="font-weight:400;color:var(--ink2);font-size:13px;">（内臓は獲れた日に処理）</span>`:(i.aging_days!=null?`<span style="font-weight:400;color:var(--ink2);font-size:13px;">（${esc(i.aging_days)}日ねかせて）</span>`:'')}</span></div>`:''}
      <div class="row"><span class="k">個体番号</span><span class="v">${esc(i.label||'—')}</span></div>
    </div>`;

    if(i.radiation_result){
      h+=`<div class="card"><h2><span class="ic">🔬</span>安全性の検査</h2>
        <div class="safe">放射性物質検査：<b>${esc(i.radiation_result)}</b>${i.radiation_date?`<br><span style="font-size:12px;">検査日 ${esc(i.radiation_date)}</span>`:''}</div>
      </div>`;
    }
    if(story.mileage) h+=mileageHtml(story.mileage);
  }

  if(parts.length){
    h+=`<div class="card"><h2><span class="ic">🔪</span>この一頭から採れた部位</h2>
      <div class="chips">${parts.map(x=>`<span class="chip">${esc(x.part)}${x.kg?' '+Number(x.kg).toFixed(2)+'kg':''}</span>`).join('')}</div>
    </div>`;
  }

  /* 感想。特典は付けない。「あなたの一言が、この一頭の記録の最後の行になる」ことが意味。
     書かなくてもスタンプ1つで残せる。送るとその場で掲載され、何人目かが分かる（2026-09-16） */
  const vc=story.voice_count!=null?Number(story.voice_count):voices.length;
  h+=`<div class="card">
    <h2><span class="ic">💬</span>${blend?'この商品':'この一頭'}の記録の、最後の一行を</h2>
    <div style="font-size:13.5px;color:var(--ink2);margin-bottom:6px;line-height:1.8;">
      山で獲れて、さばかれて、いまあなたの前にあります。この一頭の記録は、食べた人の一言で終わります。<br>
      獲った猟師と、さばいた私たちが読みます。送るとすぐこのページに載ります${vc?`（これまでに ${vc}人）`:''}。
    </div>
    <label>ひとことスタンプ（押すだけ）</label>
    <div class="chips" id="stamps">${STAMPS.map(s=>`<button type="button" class="chip" data-s="${esc(s)}" onclick="toggleStamp('${esc(s)}')" style="border:1px solid var(--line);background:var(--bg);color:var(--ink2);cursor:pointer;font-size:14px;padding:8px 12px;font-family:inherit;">${esc(s)}</button>`).join('')}</div>
    <label>おいしさ</label>
    <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" onclick="setRating(${n})">★</button>`).join('')}</div>
    <label for="dish">どんな料理にしましたか（任意）</label>
    <input id="dish" maxlength="120" placeholder="例: 串焼き、ぼたん鍋、カレー">
    <label for="comment">ひとこと（任意）</label>
    <textarea id="comment" maxlength="1000" placeholder="味わい、驚いたこと、どなたと召し上がったか など"></textarea>
    <label for="nickname">お名前・ニックネーム（任意）</label>
    <input id="nickname" maxlength="60" placeholder="例: 館山の田中">
    <button class="send" id="send" onclick="send()">${blend?'この商品':'この一頭'}の記録に一行残す</button>
    <div class="msg" id="msg"></div>
  </div>`;

  if(voices.length){
    h+=`<div class="card"><h2><span class="ic">🍽</span>${blend?'この商品':'この一頭'}を食べた人の声${vc?`（${vc}人）`:''}</h2>
      ${voices.map(v=>`<div class="voice">
        <div class="top"><span class="nm">${esc(v.nickname||'名前なし')}</span>
          ${v.rating?`<span style="color:var(--gold)">${'★'.repeat(v.rating)}</span>`:''}
          ${v.dish?`<span>${esc(v.dish)}</span>`:''}<span style="margin-left:auto">${esc(v.at||'')}</span></div>
        ${(v.stamps&&v.stamps.length)?`<div class="chips" style="margin-top:4px;">${v.stamps.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
        ${v.comment?`<div class="cm">${esc(v.comment)}</div>`:''}
      </div>`).join('')}
    </div>`;
  }

  document.getElementById('main').innerHTML=h;
  paintStars(); paintStamps();
}

function setRating(n){ rating=(rating===n?0:n); paintStars(); }
function paintStars(){
  document.querySelectorAll('#stars button').forEach(b=>{
    b.classList.toggle('on', Number(b.dataset.n)<=rating);
  });
}

async function send(){
  const btn=document.getElementById('send'), msg=document.getElementById('msg');
  const comment=document.getElementById('comment').value.trim();
  const stamps=[...picked];
  if(!rating && !comment && !stamps.length){ msg.style.color='var(--gold)'; msg.textContent='スタンプ・星・ひとことのどれか1つで大丈夫です。'; return; }
  btn.disabled=true; msg.style.color='var(--ink2)'; msg.textContent='送信しています…';
  try{
    const r=byIndividual
      ? await rpc('story_add_voice_individual',{
          p_label:label, p_nickname:document.getElementById('nickname').value,
          p_rating:rating||null, p_dish:document.getElementById('dish').value, p_comment:comment, p_stamps:stamps})
      : await rpc('story_add_voice',{
          p_code:code, p_nickname:document.getElementById('nickname').value,
          p_rating:rating||null, p_dish:document.getElementById('dish').value, p_comment:comment, p_stamps:stamps});
    if(r && r.ok){
      msg.style.color='var(--moss)';
      const nth=r.voice_count?`この一頭を食べた ${r.voice_count}人目の声として、`:'';
      const thanks='ありがとうございます。'+nth+(story&&story.blend?'この商品':'この一頭')+'の記録に、いま一行が加わりました。';
      msg.textContent=thanks;
      story=await fetchStory(); rating=0; picked=new Set(); render();
      const m2=document.getElementById('msg');
      if(m2){ m2.style.color='var(--moss)'; m2.textContent=thanks; }
    }else{
      msg.style.color='var(--gold)'; msg.textContent=(r&&r.error)||'送信できませんでした。';
      btn.disabled=false;
    }
  }catch(e){
    msg.style.color='var(--gold)'; msg.textContent='送信できませんでした。通信をご確認ください。';
    btn.disabled=false;
  }
}

load();
</script>
</body>
</html>
