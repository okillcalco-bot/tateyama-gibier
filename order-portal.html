<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>館山ジビエセンター — 注文ポータル</title>
<meta http-equiv="refresh" content="0; url=order.html">
<style>
  html,body{margin:0;height:100%}
  body{background:#0d0f0a;color:#e8e4d8;font-family:'Noto Sans JP',sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  a{color:#e8c878}
</style>
<script>
  // 注文ポータルは新しい注文画面 order.html に統一しました。
  // クエリ（お客様番号など）は引き継ぐ。ハッシュ（旧 #t= トークン）は
  // order.html 側で無視される設計のため、あえて引き継がない。
  (function () {
    try {
      var dest = 'order.html' + (location.search || '');
      location.replace(dest);
    } catch (e) {
      location.href = 'order.html';
    }
  })();
</script>
</head>
<body>
  <div>
    <p>注文ページに移動しています…</p>
    <p>自動で切り替わらない場合は <a href="order.html">こちらの注文ページ</a> をタップしてください。</p>
  </div>
</body>
</html>
